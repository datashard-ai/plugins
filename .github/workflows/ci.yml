name: ci

on:
  pull_request:
    # edited: the description holds the Urgent line, and the check reads it as it is now.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  packages:
    runs-on: ubuntu-24.04
    # A newer run for the same pull request (an edit of its description, a push) replaces the one before it.
    concurrency:
      group: packages-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    # The pin check reads pull requests through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      # People get a package's change only when its version changes, and only once a pull request has moved the pin to
      # it. A pull request is compared with its base branch, a push to main with main before it.
      - name: Each changed package's version goes up
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: bash tests/version-check.sh
      # Each package is pinned to a commit that has been on main for 7 days, or has a written reason in the pull request.
      # The check reads the description through the API when it runs, not from the event that started the run. It is the
      # pull request's own copy of tests/pin.mjs and of this file that runs here, so this step alone can't hold a pull
      # request that weakens them; the pin-from-main check (pin-from-main.yml) runs main's copy against the pull request's
      # files, and is the one that judges the pin. A same-named check from a pull request's own workflow that
      # passes after pin-from-main's own run failed does not get past it: GitHub counts every run with the required name,
      # so pin-from-main's failure still blocks (tested Nov 13, 2026, in that order only).
      - name: The pin moves only to a commit that has waited
        if: github.event_name == 'pull_request'
        env:
          BASE: refs/remotes/origin/${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: node tests/pin.mjs check
      # After the merge, main is checked again for its shape, the pin being on main, versions, one commit for all packages
      # and pin-only changes. The age is not looked at, so this can't tell a pin merged early on purpose from one merged
      # early by mistake; the job summary shows every pin change. Not on a branch's first push, which has no commit before it.
      - name: The pin that reached main is in order
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE: ${{ github.event.before }}
        run: node tests/pin.mjs check --after-merge
      - run: node --test tests/*.test.mjs
      # The review skill's script. PYTHONDONTWRITEBYTECODE keeps a __pycache__ out of the tree.
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py'
      # Claude Code 2.1.304, pinned with integrity by .github/claude-code's lock file. Installed without its install
      # script, which only copies the native binary into place; the package's cli-wrapper.cjs runs that binary instead.
      # That file is the package's own, not a documented entry point: check it is still there when changing the version.
      - run: npm ci --prefix .github/claude-code --ignore-scripts
      - name: cli-wrapper.cjs is where this version keeps it
        run: test -f .github/claude-code/node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs
      - name: The marketplace and every package pass Claude Code's strict validation
        run: |
          claude() { node .github/claude-code/node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs "$@"; }
          # The pinned version runs, so a wrapper that found no binary can't pass the checks below unrun.
          pinned=$(node -p 'require("./.github/claude-code/package.json").dependencies["@anthropic-ai/claude-code"]')
          claude --version | grep -F "$pinned (Claude Code)"
          claude plugin validate --strict .
          for package in plugins/*/; do claude plugin validate --strict "$package"; done

  # After each push to main, a failing "plugin version" status on any open pull request whose package version main has
  # caught up with. Main requires a pull request and the packages check on an up-to-date branch, and refuses force
  # pushes, so such a pull request can't merge as it is; the status shows which ones before anyone tries.
  plugin-prs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # A run for an older main must not finish last and overwrite a newer run's statuses.
    concurrency:
      group: plugin-prs
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: bash tests/open-prs-check.sh
        env:
          GH_TOKEN: ${{ github.token }}
